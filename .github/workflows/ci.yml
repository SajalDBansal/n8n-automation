name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Throwaway values, only used against the ephemeral CI Postgres service —
  # never used against a real database.
  BETTER_AUTH_SECRET: ci-throwaway-better-auth-secret
  BETTER_AUTH_URL: http://localhost:3000
  CREDENTIAL_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/n8n_test

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: n8n_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run generate
        working-directory: packages/database

      - name: Apply database migrations
        run: bun run db:migrate:deploy
        working-directory: packages/database

      - name: Start dev server
        run: bun run dev > /tmp/dev-server.log 2>&1 &
        working-directory: apps/web

      - name: Wait for dev server
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3000; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"
          cat /tmp/dev-server.log
          exit 1

      - name: Run integration tests
        run: bun run test
        working-directory: apps/web

      - name: Show dev server log on failure
        if: failure()
        run: cat /tmp/dev-server.log

  docker-build-push:
    runs-on: ubuntu-latest
    # Only runs after both check jobs pass, and only for real merges to
    # main — not on every PR, since PRs shouldn't push images.
    needs: [static-checks, test]
    # Only execute this job when the workflow was triggered by a push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/n8n-automation-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/n8n-automation-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

          build-args: |
            DATABASE_URL=postgresql://ci:ci@localhost:5432/ci_build_placeholder
            BETTER_AUTH_SECRET=ci-build-time-placeholder-not-used-at-runtime
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
